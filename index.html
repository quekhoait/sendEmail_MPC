<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gửi Email Tự Động</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services SDK & Google API Client (Drive Picker) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f5822a'><path d='M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/></svg>">
  <style>
    .rich-editor-content, .email-preview-content {
      outline: none;
      word-break: break-word;
    }
    .rich-editor-content ul, .email-preview-content ul {
      list-style-type: disc !important;
      padding-left: 1.5rem !important;
      margin: 0.5rem 0 !important;
    }
    .rich-editor-content ol, .email-preview-content ol {
      list-style-type: decimal !important;
      padding-left: 1.5rem !important;
      margin: 0.5rem 0 !important;
    }
    .rich-editor-content li, .email-preview-content li {
      margin-bottom: 0.25rem !important;
    }
    .rich-editor-content h1, .email-preview-content h1 {
      font-size: 1.65rem !important;
      font-weight: 700 !important;
      margin-top: 0.75rem !important;
      margin-bottom: 0.5rem !important;
      line-height: 1.3 !important;
    }
    .rich-editor-content h2, .email-preview-content h2 {
      font-size: 1.35rem !important;
      font-weight: 700 !important;
      margin-top: 0.75rem !important;
      margin-bottom: 0.35rem !important;
      line-height: 1.35 !important;
    }
    .rich-editor-content h3, .email-preview-content h3 {
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      margin-top: 0.5rem !important;
      margin-bottom: 0.25rem !important;
    }
    .rich-editor-content p, .email-preview-content p {
      margin-top: 0.35rem !important;
      margin-bottom: 0.35rem !important;
    }
    .rich-editor-content blockquote, .email-preview-content blockquote {
      border-left: 4px solid #818cf8 !important;
      padding-left: 1rem !important;
      margin-left: 1rem !important;
      color: #475569 !important;
      font-style: italic !important;
    }
    .rich-editor-content a, .email-preview-content a {
      color: #4f46e5 !important;
      text-decoration: underline !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
